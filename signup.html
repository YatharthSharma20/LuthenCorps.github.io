            </button>

    </nav>

    <div id="overlay"></div>


    <!-- sign in page -->
    <div class="main-main-div">
        <div class="maindiv">
        <div class="logintext">
           <h1>Welcome :)</h1>
           <h2>Sign up</h2>
           <p>Join us today and get started</p>
        </div>

        <div class="inputbox input-signUp">
            <div class="namediv">
                <label for="name" style="font-size: 14px; font-weight: bold;">Full Name</label>
                <input type="name" id="username" name="name" class="emailinput" placeholder="Yogesh Kumar">
            </div>

            <div class="emaildiv">
                <label for="email" style="font-size: 14px; font-weight: bold;">Email Address</label>
                <input type="email" id="email" name="email" class="emailinput" placeholder="you@example.com">
            </div>

            <div class="passdiv">
                <label for="password" style="font-size: 14px; font-weight: bold;">Password</label>
                <div class="passdivchild"><input type="password" id="password" name="password" class="passwordinput" placeholder="Enter your password"> <i id="icon" class="fa-regular fa-eye" tabindex="-1"></i></div>
            </div>
            <button type="button" class="loginbut">Sign up</button>
        </div>
        <div class="ordiv">
            <div class="orcdiv" id="chiled1"></div>
            <p>or continue with</p>
            <div class="orcdiv" id="chiled2"></div>
        </div>
        <div class="googlelog">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
                </svg>
        </div>
        <div class="signup">
            <p>Don't have an account? <a href="signin.html">Sign in</a></p>
        </div>
        </div>
    </div>
